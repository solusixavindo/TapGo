name: tapgo_driver_app
description: TapGo driver application.
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  # Versi disamakan dengan user_app supaya kedua aplikasi menarik plugin native
  # yang sama; versi berbeda pada plugin platform mudah berakhir sebagai
  # kegagalan build yang hanya muncul di salah satu aplikasi.
  image_picker: ^1.1.2
  # Runtime Flutter merujuk packages/cupertino_icons/CupertinoIcons melalui
  # pustaka Cupertino yang ikut tertaut dari package:flutter/material.dart
  # (lihat cupertino/text_field.dart). Tanpa dependency ini build memperingatkan
  # font tersebut tidak ditemukan, dan glyph yang bersangkutan berisiko tampil
  # sebagai kotak tofu. Bukan ditambahkan karena laporan lama menyebutnya.
  cupertino_icons: ^1.0.8
  # Chat per-perjalanan (Stage R2.10). Versi disamakan dengan user_app.
  socket_io_client: ^3.0.0
  # Penanda "onboarding sudah dilihat" (Splash/Onboarding). Versi disamakan
  # dengan user_app, mengikuti konvensi plugin platform yang sama di atas.
  shared_preferences: ^2.3.3
  # Daftar/masuk dengan akun Google. Membutuhkan OAuth client (Android + Web)
  # terdaftar di Google Cloud Console sebelum benar-benar berfungsi — lihat
  # catatan di google_sign_in_button.dart.
  google_sign_in: ^6.2.2
  # Peta live posisi driver di Beranda + kirim lokasi berkala ke backend
  # selama online. Versi disamakan dengan user_app (lihat catatan di atas).
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  # Verifikasi wajah harian sebelum online. camera = preview/tangkap kamera
  # depan live; google_mlkit_face_detection = deteksi wajah + sinyal liveness
  # dasar (mata terbuka, satu wajah, framing) — TIDAK melakukan pencocokan
  # identitas. tflite_flutter menjalankan model embedding wajah yang
  # dibundel terpisah (lihat face_check_pipeline.dart) untuk pencocokan
  # sesungguhnya terhadap referensi KYC. Seluruhnya on-device, tanpa API
  # pihak ketiga — sesuai keputusan Owner.
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.11.0
  tflite_flutter: ^0.11.0
  # Tombol "Buka di Google Maps" pada kartu perjalanan aktif — men-delegasikan
  # navigasi turn-by-turn ke aplikasi peta eksternal, persis pola Gojek/Grab.
  # Versi disamakan dengan user_app.
  url_launcher: ^6.3.1
  sentry_flutter: ^9.30.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/tapgo_logo_512.png
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
