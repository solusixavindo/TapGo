name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tapgo
          POSTGRES_PASSWORD: tapgo_password
          POSTGRES_DB: tapgo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Kredensial di bawah ini nilai dummy/sandbox saja — sama persis dengan
      # apps/backend/.env.test.example yang sudah ada di repo, bukan secret
      # sungguhan. Aman ditulis langsung di sini, tidak perlu GitHub Secrets.
      NODE_ENV: test
      # connection_limit=25: tetap cukup untuk uji konkurensi terberat suite
      # (registrationQuotaConcurrency.integration.test.ts, ~20 aktor paralel)
      # tapi lebih rendah dari default harness (30) — mengurangi tekanan pada
      # max_connections Postgres (100 bawaan image) di samping perbaikan
      # tests/setup/disconnectPrismaAfterFile.ts yang menutup pool tiap file.
      DATABASE_URL: postgresql://tapgo:tapgo_password@localhost:5432/tapgo_test?schema=public&connection_limit=25
      TAPGO_TEST_DATABASE_URL: postgresql://tapgo:tapgo_password@localhost:5432/tapgo_test?schema=public&connection_limit=25
      JWT_ACCESS_SECRET: tapgo_test_access_secret_64_chars_minimum_for_integration_tests
      JWT_REFRESH_SECRET: tapgo_test_refresh_secret_64_chars_minimum_for_integration_tests
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL_DAYS: "30"
      CORS_ORIGINS: http://localhost:3000
      MIDTRANS_SERVER_KEY: SB-Mid-server-test-key
      MIDTRANS_CLIENT_KEY: SB-Mid-client-test-key
      MIDTRANS_IS_PRODUCTION: "false"
      MIDTRANS_NOTIFICATION_SECRET: ""
      MIDTRANS_SNAP_URL: http://127.0.0.1:59999/snap/v1/transactions
      PPOB_PROVIDER: stub
      DIGIFLAZZ_USERNAME: tapgo_test_user
      DIGIFLAZZ_API_KEY: tapgo_test_api_key
      DIGIFLAZZ_TESTING: "true"
      DIGIFLAZZ_WEBHOOK_SECRET: tapgo_test_webhook_secret_32chars
      PPOB_RECONCILE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Prisma generate
        working-directory: apps/backend
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Prisma migrate (test database)
        working-directory: apps/backend
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - run: npm run lint --workspace apps/backend

      - name: Typecheck (tsc)
        run: npm run build --workspace apps/backend

      - run: npm test --workspace apps/backend

  driver_app:
    name: driver_app (analyze, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable

      - name: flutter pub get
        working-directory: apps/driver_app
        run: flutter pub get

      - name: flutter analyze
        working-directory: apps/driver_app
        run: flutter analyze

      - name: flutter test
        working-directory: apps/driver_app
        run: flutter test

  # ---------------------------------------------------------------------------
  # Aplikasi MOBILE tidak boleh memuat fungsi admin/Founder (konsol admin hanya
  # di web). Tiga lapis, dari murah ke mahal:
  #   1. mobile_surface_guard      — pola di KODE SUMBER (detik)
  #   2. user_app                  — analyze + test (user_app dulu tidak dijaga
  #                                  CI sama sekali, sehingga kode admin yang
  #                                  "disembunyikan" tak pernah ada yang menegur)
  #   3. user_app_release_artifact — build APK RILIS sungguhan lalu periksa ISI
  #                                  binernya, karena yang penting adalah apa
  #                                  yang sampai ke pengguna, bukan apa yang
  #                                  tertulis di repo.
  # Latar belakang: docs/release/LAPORAN_KODE_ADMIN_DI_APLIKASI_USER.md
  # ---------------------------------------------------------------------------
  mobile_surface_guard:
    name: mobile (tanpa kode admin/Founder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplikasi mobile tidak boleh memuat kode admin/Founder
        run: bash scripts/guard-mobile-no-admin.sh

  user_app:
    name: user_app (analyze, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable

      - name: flutter pub get
        working-directory: apps/user_app
        run: flutter pub get

      - name: flutter analyze
        working-directory: apps/user_app
        run: flutter analyze

      - name: flutter test
        working-directory: apps/user_app
        run: flutter test

  user_app_release_artifact:
    name: user_app (build rilis + periksa artefak)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable

      - name: flutter pub get
        working-directory: apps/user_app
        run: flutter pub get

      # Build rilis mewajibkan key.properties + keystore. Di CI dipakai keystore
      # SEMENTARA yang dibuat saat itu juga dan dibuang bersama runner — BUKAN
      # kunci unggah Play. APK ini hanya dipakai untuk diperiksa isinya.
      - name: Keystore sementara khusus CI
        working-directory: apps/user_app/android
        run: |
          mkdir -p keystore
          PASS="$(openssl rand -hex 16)"
          keytool -genkeypair -keystore keystore/ci-throwaway.jks -alias ci \
            -keyalg RSA -keysize 2048 -validity 2 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=tapgo-ci"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=ci\nstoreFile=../keystore/ci-throwaway.jks\n' \
            "$PASS" "$PASS" > key.properties

      - name: Build APK rilis
        working-directory: apps/user_app
        run: flutter build apk --release --target-platform android-arm64

      - name: Periksa isi APK (tidak ada jejak admin/Founder)
        run: bash scripts/verify-mobile-artifact.sh apps/user_app/build/app/outputs/flutter-apk/app-release.apk

  driver_app_release_artifact:
    name: driver_app (build rilis + periksa artefak)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable

      - name: flutter pub get
        working-directory: apps/driver_app
        run: flutter pub get

      # Build rilis driver_app sebelumnya TIDAK PERNAH diperiksa CI, sehingga
      # kegagalan tflite_flutter (target JVM, compileSdk, R8) tidak terdeteksi.
      # Keystore SEMENTARA seperti job user_app; bukan kunci unggah Play.
      - name: Keystore sementara khusus CI
        working-directory: apps/driver_app/android
        run: |
          mkdir -p keystore
          PASS="$(openssl rand -hex 16)"
          keytool -genkeypair -keystore keystore/ci-throwaway.jks -alias ci \
            -keyalg RSA -keysize 2048 -validity 2 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=tapgo-ci"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=ci\nstoreFile=../keystore/ci-throwaway.jks\n' \
            "$PASS" "$PASS" > key.properties

      - name: Build APK rilis
        working-directory: apps/driver_app
        run: flutter build apk --release --target-platform android-arm64

      - name: Periksa isi APK (tidak ada jejak admin/Founder)
        env:
          VERIFY_CONTROL_STRING: /driver/rides/offers
        run: bash scripts/verify-mobile-artifact.sh apps/driver_app/build/app/outputs/flutter-apk/app-release.apk
