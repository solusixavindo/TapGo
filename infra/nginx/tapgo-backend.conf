# Nginx reverse proxy untuk TapGo backend — domain api.tapgolion.id (sesuaikan
# bila domain berbeda). HANYA blok HTTP di sini — lihat README.md di folder
# ini untuk langkah pasti mengaktifkan HTTPS lewat Certbot, yang akan
# menyisipkan blok server HTTPS + redirect secara OTOMATIS ke file ini.
# Menulis blok HTTPS manual di sini SEBELUM sertifikat benar-benar ada akan
# membuat "nginx -t" gagal (path sertifikat belum ada).

# Zona rate-limit anti-DDoS dasar — 20 request/detik per IP, burst 40 sebelum
# ditolak. Ini pertahanan lapisan pertama; rate limiter aplikasi (lihat
# src/core/security/rateLimit.ts, sudah per-endpoint & lebih ketat untuk
# rute sensitif seperti /auth) tetap jadi pertahanan utama.
limit_req_zone $binary_remote_addr zone=tapgo_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.tapgolion.id;

    # client_max_body_size default Nginx adalah 1MB — backend menerima
    # unggahan dokumen driver/membership sampai 5MB (lihat MAX_DOCUMENT_BYTES
    # di DriverDocumentService.ts/MembershipDocumentService.ts). 6M diberi
    # sedikit headroom di atas batas aplikasi, bukan dibuat sama persis.
    client_max_body_size 6M;

    location / {
        limit_req zone=tapgo_api burst=40 nodelay;

        # Backend Docker hanya expose ke 127.0.0.1 (lihat
        # infra/docker-compose.prod.yml) — port di bawah harus SAMA dengan
        # PORT di apps/backend/.env (default 4000).
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # app.ts sudah set `trust proxy = 1` — header ini WAJIB benar supaya
        # rate limiter & audit log mencatat IP klien asli, bukan IP Nginx.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO (realtime, lihat src/realtime/socket.ts) butuh koneksi
        # tetap terbuka untuk WebSocket upgrade.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # ACME challenge Certbot — jangan dihapus meski sudah HTTPS, dipakai lagi
    # tiap kali sertifikat diperpanjang otomatis.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}
